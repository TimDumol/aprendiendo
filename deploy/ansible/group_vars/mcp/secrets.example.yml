---
# Copy to secrets.yml, encrypt with ansible-vault, and replace every value.
# Never commit the resulting secrets.yml.
# Pocket ID subject allowed to access Aprendiendo. Keep this in protected
# deployment material; it is intentionally not part of the checked-in profile.
mcp_oidc_allowed_subject: replace-me-with-pocket-id-uuid

# Preserved for one rollback window while embedded OAuth remains available.
mcp_oauth_username: replace-me
# An Argon2id PHC hash, not the plaintext password. Generate it, for example,
# with `argon2 <(printf %s 'your-password') -id -t 3 -m 16 -p 1`.
mcp_oauth_password_hash: $argon2id$v=19$m=65536,t=3,p=1$replace-me$replace-me
