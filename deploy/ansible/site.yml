---
- name: Deploy Aprendiendo MCP with Docker and Caddy
  hosts: mcp
  become: true
  vars_files:
    - group_vars/mcp/secrets.yml
  pre_tasks:
    - name: Verify required secret variables are supplied
      ansible.builtin.assert:
        that:
          - mcp_oidc_allowed_subject is string
          - mcp_oidc_allowed_subject is match('^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$')
          - mcp_oauth_username is string
          - mcp_oauth_username is not search('replace-me')
          - mcp_oauth_password_hash is match('^\\$argon2id\\$')
        fail_msg: >-
          Supply the Pocket ID subject and preserved embedded OAuth rollback
          values in group_vars/mcp/secrets.yml (preferably encrypted with
          ansible-vault) before deployment.
      no_log: true
      tags:
        - always

    - name: Verify a preloaded application image was supplied
      ansible.builtin.assert:
        that:
          - mcp_image is string
          - mcp_image | length > 0
        fail_msg: >-
          Supply mcp_image with the locally built application image tag;
          use scripts/release.sh for the complete release flow.

  tasks:
    - name: Install Docker Engine and Compose plugin prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - docker.io
          - docker-compose-v2
          - git
          - openssl
        state: present
        update_cache: true
      tags:
        - bootstrap

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
      tags:
        - bootstrap

    - name: Verify the application image is loaded
      ansible.builtin.command:
        argv:
          - docker
          - image
          - inspect
          - "{{ mcp_image }}"
      changed_when: false

    - name: Inspect the shared Caddy edge network
      ansible.builtin.command:
        argv:
          - docker
          - network
          - inspect
          - --format
          - "{{ '{{' }}.Driver{{ '}}' }}"
          - caddy-edge
      check_mode: false
      changed_when: false
      failed_when: false
      register: caddy_edge_inspect

    - name: Reject a non-bridge shared Caddy edge network
      ansible.builtin.assert:
        that:
          - caddy_edge_inspect.rc != 0 or caddy_edge_inspect.stdout | trim == 'bridge'
        fail_msg: caddy-edge exists but is not a Docker bridge network.

    - name: Create the shared Caddy edge network when absent
      ansible.builtin.command:
        argv:
          - docker
          - network
          - create
          - --driver
          - bridge
          - caddy-edge
      when:
        - caddy_edge_inspect.rc != 0
        - not ansible_check_mode
      check_mode: false
      changed_when: true

    - name: Create deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0750'
      loop:
        - "{{ mcp_deploy_dir }}"
        - "{{ mcp_deploy_dir }}/app"
        - "{{ mcp_deploy_dir }}/secrets"

    - name: Create the root-owned shared Caddy site directory
      ansible.builtin.file:
        path: "{{ mcp_caddy_sites_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Check whether the production SQLite database exists
      ansible.builtin.stat:
        path: "{{ mcp_deploy_dir }}/app/data/aprendiendo.sqlite3"
      register: production_database

    - name: Seed the production SQLite database once
      ansible.builtin.copy:
        src: ../../data/aprendiendo.sqlite3
        dest: "{{ mcp_deploy_dir }}/app/data/aprendiendo.sqlite3"
        owner: '65532'
        group: '65532'
        mode: '0600'
      when: not production_database.stat.exists

    - name: Make the persistent data directory writable by the application
      ansible.builtin.file:
        path: "{{ mcp_deploy_dir }}/app/data"
        state: directory
        owner: '65532'
        group: '65532'
        mode: '0700'

    - name: Write production environment
      ansible.builtin.copy:
        dest: "{{ mcp_deploy_dir }}/app/.env"
        owner: root
        group: root
        mode: '0600'
        content: |
          DATABASE_PATH=/data/aprendiendo.sqlite3
          DATABASE_TIMEOUT_SECONDS=10
          BIND_ADDR=0.0.0.0:8080
          MAX_REQUEST_BYTES=131072
          RUST_LOG=aprendiendo_mcp=info,tower_http=info
          GEMINI_MODEL={{ mcp_gemini_model | default('gemini-3.8-flash') }}
          GEMINI_API_KEY={{ mcp_gemini_api_key | default('', true) }}
          PRACTICE_MEDIA_DIR=/data/practice-media
          PRACTICE_SERVER_AUDIO_CAP_BYTES={{ mcp_practice_server_audio_cap_bytes | default(524288000) }}
          PRACTICE_MONTHLY_SPEND_CAP_USD={{ mcp_practice_monthly_spend_cap_usd | default(1.0) }}
          PRACTICE_ANALYSIS_RESERVATION_USD={{ mcp_practice_analysis_reservation_usd | default(0.10) }}
          AUTH_MODE={{ mcp_auth_mode }}
          PUBLIC_BASE_URL={{ mcp_public_base_url }}
          OIDC_ISSUER={{ mcp_oidc_issuer }}
          OIDC_JWKS_URL={{ mcp_oidc_jwks_url }}
          OIDC_AUDIENCE={{ mcp_oidc_audience }}
          OIDC_ALLOWED_SUBJECT={{ mcp_oidc_allowed_subject }}
          OIDC_REQUIRED_SCOPE={{ mcp_oidc_required_scope }}
      no_log: true

    - name: Preserve the embedded OAuth signing key for the rollback window
      ansible.builtin.command:
        argv:
          - openssl
          - genpkey
          - -algorithm
          - RSA
          - -pkeyopt
          - rsa_keygen_bits:3072
          - -out
          - "{{ mcp_deploy_dir }}/secrets/oauth-signing-key.pem"
        creates: "{{ mcp_deploy_dir }}/secrets/oauth-signing-key.pem"

    - name: Protect OAuth signing key
      ansible.builtin.file:
        path: "{{ mcp_deploy_dir }}/secrets/oauth-signing-key.pem"
        # The application image runs as this fixed, non-root numeric account.
        owner: '65532'
        group: '65532'
        mode: '0400'

    - name: Install the Docker Compose configuration
      ansible.builtin.copy:
        dest: "{{ mcp_deploy_dir }}/app/compose.production.yaml"
        owner: root
        group: root
        mode: '0644'
        content: |
          services:
            mcp:
              image: "{{ mcp_image }}"
              pull_policy: never
              restart: unless-stopped
              env_file: .env
              read_only: true
              tmpfs:
                - /tmp:size=8m,mode=1777
              volumes:
                - {{ mcp_deploy_dir }}/secrets/oauth-signing-key.pem:/run/secrets/oauth-signing-key.pem:ro
                - {{ mcp_deploy_dir }}/app/data:/data
              mem_limit: 96m
              pids_limit: 256
              cap_drop:
                - ALL
              security_opt:
                - no-new-privileges:true
              networks:
                default: {}
                caddy-edge: {}
            practice-worker:
              image: "{{ mcp_image }}"
              pull_policy: never
              entrypoint: ["/usr/local/bin/practice_worker"]
              restart: unless-stopped
              env_file: .env
              read_only: true
              tmpfs:
                - /tmp:size=16m,mode=1777
              volumes:
                - {{ mcp_deploy_dir }}/app/data:/data
              mem_limit: 256m
              pids_limit: 256
              cap_drop:
                - ALL
              security_opt:
                - no-new-privileges:true
              networks:
                default: {}
            caddy:
              image: {{ mcp_caddy_image }}
              restart: unless-stopped
              ports:
                - "80:80"
                - "443:443"
              volumes:
                - ./Caddyfile:/etc/caddy/Caddyfile:ro
                - {{ mcp_caddy_sites_dir }}:/etc/caddy/sites-enabled:ro
                - caddy_data:/data
                - caddy_config:/config
              cap_drop:
                - ALL
              cap_add:
                - NET_BIND_SERVICE
              security_opt:
                - no-new-privileges:true
              networks:
                default: {}
                caddy-edge: {}
              depends_on:
                mcp:
                  condition: service_started

          networks:
              default: {}
              caddy-edge:
                external: true
                name: caddy-edge

          volumes:
            caddy_data:
            caddy_config:

    - name: Install Caddy configuration
      ansible.builtin.copy:
        dest: "{{ mcp_deploy_dir }}/app/Caddyfile"
        owner: root
        group: root
        mode: '0644'
        content: |
          {
              admin 127.0.0.1:2019
          }

          import sites-enabled/*

          {{ mcp_domain }} {
              encode zstd gzip
              log {
                  output stdout
                  format json
              }
              header {
                  -Server
                  Strict-Transport-Security "max-age=31536000; includeSubDomains"
                  X-Content-Type-Options "nosniff"
              }
              reverse_proxy mcp:8080
          }

    - name: Start the application and TLS proxy
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - compose.production.yaml
          - up
          - --detach
          - --force-recreate
      args:
        chdir: "{{ mcp_deploy_dir }}/app"
      changed_when: true

    - name: Verify service health locally through Caddy
      ansible.builtin.uri:
        url: "https://{{ mcp_domain }}/health"
        return_content: true
        status_code: 200
        validate_certs: true
      register: mcp_health
      retries: 12
      delay: 5
      until: mcp_health.status == 200
