services:
  mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    mem_limit: 96m
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  practice-worker:
    build: .
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/practice_worker"]
    env_file: .env
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - ./data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_add:
      - NET_BIND_SERVICE
    depends_on:
      - mcp

volumes:
  caddy_data:
  caddy_config:
